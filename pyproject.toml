[project]
name = "rmx-tooling"
version = "0.1.0"
description = "Hardware generation, validation and packaging tools for AFX-1000"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.4",
    "Pillow==13.0.0",
    "trimesh==5.1.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 110
include = ["hardware/**/*.py", "tests/**/*.py", "tools/**/*.py"]
extend-exclude = ["build*", "hardware/cad/generated", "hardware/firmware/build*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E741"]
