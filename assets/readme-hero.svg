<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">RMX - Performance, rewired.</title>
  <desc id="desc">Amber and teal artwork with a stylized effects dial and waveform on a dark background. Stereo performance effects for macOS.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151b25"/><stop offset="1" stop-color="#080c12"/>
    </linearGradient>
    <linearGradient id="wave" x1="690" y1="250" x2="1280" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#65d9cc" stop-opacity="0"/><stop offset=".3" stop-color="#65d9cc"/><stop offset="1" stop-color="#f6b44d"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#65d9cc" stop-opacity=".12"/><stop offset="1" stop-color="#65d9cc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dial" x1="882" y1="112" x2="1106" y2="336" gradientUnits="userSpaceOnUse">
      <stop stop-color="#303a49"/><stop offset="1" stop-color="#111720"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#c0d0e0" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1280" height="460" rx="20" fill="url(#background)"/>
  <rect width="1280" height="460" rx="20" fill="url(#grid)"/>
  <circle cx="1000" cy="222" r="280" fill="url(#halo)"/>
  <path d="M56 48H84" stroke="#f6b44d" stroke-width="3"/>
  <text x="96" y="53" fill="#a8b7c7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="3">STEREO PERFORMANCE FX</text>
  <text x="50" y="202" fill="#f4f7fb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="140" font-weight="800" letter-spacing="-8">RMX<tspan fill="#f6b44d">.</tspan></text>
  <text x="58" y="262" fill="#f4f7fb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="38" font-weight="600" letter-spacing="-1">Performance, rewired.</text>
  <text x="60" y="300" fill="#a8b7c7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17">Ten Scene FX. Three bands. Your next transition.</text>
  <g stroke="#74849b" stroke-opacity=".2">
    <circle cx="1000" cy="220" r="158"/><circle cx="1000" cy="220" r="142"/>
    <path d="M1000 47V57M1000 383V393M827 220H837M1163 220H1173"/>
  </g>
  <circle cx="1000" cy="220" r="142" stroke="#f6b44d" stroke-width="6" stroke-dasharray="364 528" transform="rotate(140 1000 220)"/>
  <circle cx="1000" cy="220" r="142" stroke="#65d9cc" stroke-width="6" stroke-dasharray="236 656" transform="rotate(-40 1000 220)"/>
  <path d="M680 220H742L754 208L768 237L782 178L796 255L810 202L822 220H1172L1182 208L1196 240L1210 185L1224 253L1238 213L1248 220H1280" stroke="url(#wave)" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="1000" cy="224" r="114" fill="#05080d" opacity=".8"/>
  <circle cx="1000" cy="220" r="112" fill="url(#dial)" stroke="#465165"/>
  <circle cx="1000" cy="220" r="98" stroke="#74849b" stroke-opacity=".16"/>
  <path d="M1000 128V157" stroke="#f6b44d" stroke-width="5" stroke-linecap="round"/>
  <text x="1000" y="218" text-anchor="middle" fill="#f4f7fb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" letter-spacing="3">SCENE FX</text>
  <text x="1000" y="245" text-anchor="middle" fill="#65d9cc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" letter-spacing="2">DEPTH / MIX</text>
  <path d="M60 352H1220" stroke="#74849b" stroke-opacity=".2"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="2">
    <circle cx="65" cy="398" r="4" fill="#f6b44d"/><text x="80" y="402" fill="#d4dee9">SCENE</text>
    <circle cx="240" cy="398" r="4" fill="#65d9cc"/><text x="255" y="402" fill="#d4dee9">ISOLATE</text>
    <circle cx="432" cy="398" r="4" fill="#65d9cc"/><text x="447" y="402" fill="#d4dee9">X-PAD</text>
    <circle cx="601" cy="398" r="4" fill="#f6b44d"/><text x="616" y="402" fill="#d4dee9">RELEASE</text>
    <text x="1220" y="402" text-anchor="end" fill="#8999ad" font-size="11">NATIVE macOS / AU / VST3</text>
  </g>
</svg>
