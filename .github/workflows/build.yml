name: Build and engine checks
on: [push, pull_request]
jobs:
  standalone:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.26'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked cmake -S hardware/runtime -B build/standalone-runtime -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/standalone-runtime --parallel 3
      - run: ctest --test-dir build/standalone-runtime --output-on-failure
      - run: uv run --locked python hardware/firmware/full_engine/generate_kernels.py --check
      - run: uv run --locked cmake -S hardware/firmware/full_engine -B build/full-engine-host -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/full-engine-host --parallel 3
      - run: ctest --test-dir build/full-engine-host --output-on-failure
      - run: uv run --locked python -m hardware.firmware.control_map --check
      - run: uv run --locked python -m unittest discover -s tests/tooling
      - run: uv run --locked python -m unittest discover -s tests -p 'a*_integration_tests.py'
  core:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.26'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 3
      - run: ctest --test-dir build --output-on-failure
      - run: ./build/rmx_benchmark 2000
  plugins:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.26'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRMX_BUILD_PLUGINS=ON '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
      - run: cmake --build build --parallel 3
      - run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        if: ${{ vars.AFX_ENABLE_LICENSED_BINARY_DISTRIBUTION == 'true' }}
        with:
          name: RMX-macOS
          path: |
            build/RMX.app
            build/RMXPlugin_artefacts/Release/AU
            build/RMXPlugin_artefacts/Release/VST3
      - run: cmake --build build --target RMXPluginProbe --parallel 3
      - run: ./build/RMXPluginProbe_artefacts/Release/RMXPluginProbe "$PWD/build/RMXPlugin_artefacts/Release/VST3/RMX.vst3" > build/vst3-runtime.json
      - run: uv run --locked python tools/package_macos.py --build-dir build --output-dir build/packages
      - uses: actions/upload-artifact@v4
        if: ${{ vars.AFX_ENABLE_LICENSED_BINARY_DISTRIBUTION == 'true' }}
        with:
          name: RMX-macOS-preview-packages
          path: |
            build/packages/
            build/*-runtime.json
