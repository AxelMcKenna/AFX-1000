name: Build and engine checks
on: [push, pull_request]
jobs:
  standalone:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r hardware/cad/a11/requirements.txt
      - run: cmake -S hardware/runtime -B build/standalone-runtime -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/standalone-runtime --parallel 3
      - run: ctest --test-dir build/standalone-runtime --output-on-failure
      - run: python -m hardware.firmware.control_map --check
      - run: python -m unittest discover -s tests/tooling
      - run: python -m unittest discover -s tests -p 'a*_integration_tests.py'
  core:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 3
      - run: ctest --test-dir build --output-on-failure
      - run: ./build/rmx_benchmark 2000
  plugins:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRMX_BUILD_PLUGINS=ON '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
      - run: cmake --build build --parallel 3
      - run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: RMX-macOS
          path: |
            build/RMX.app
            build/RMXPlugin_artefacts/Release/AU
            build/RMXPlugin_artefacts/Release/VST3
      - run: cmake --build build --target RMXPluginProbe --parallel 3
      - run: ./build/RMXPluginProbe_artefacts/Release/RMXPluginProbe "$PWD/build/RMXPlugin_artefacts/Release/VST3/RMX.vst3" > build/vst3-runtime.json
      - run: python3 tools/package_macos.py --build-dir build --output-dir build/packages
      - uses: actions/upload-artifact@v4
        with:
          name: RMX-macOS-preview-packages
          path: |
            build/packages/
            build/*-runtime.json
