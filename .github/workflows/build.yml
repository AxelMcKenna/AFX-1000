name: Build and engine checks
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/quality/requirements.txt
      - run: python tools/quality/check_format.py
      - run: ruff check hardware tests tools
      - run: ruff format --check hardware tests tools
      - run: python -m unittest discover -s tests/tooling -p 'test_*.py'
  sanitizers:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DRMX_BUILD_NATIVE=OFF -DRMX_SANITIZER=${{ matrix.sanitizer }}
        env:
          CC: clang
          CXX: clang++
      - run: cmake --build build --parallel 3
      - run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1
  core:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 3
      - run: ctest --test-dir build --output-on-failure
      - run: ./build/rmx_benchmark 2000 --csv benchmark.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RMX-performance-${{ matrix.os }}
          path: benchmark.csv
  plugins:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRMX_BUILD_PLUGINS=ON '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
      - run: cmake --build build --parallel 3
      - run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: RMX-macOS
          path: |
            build/RMX.app
            build/RMXPlugin_artefacts/Release/AU
            build/RMXPlugin_artefacts/Release/VST3
