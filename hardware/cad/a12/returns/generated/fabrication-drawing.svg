<text x="40" y="972" class="">RETENTION SECTION: sloped seat/cap underside, flat upper screw-bearing face; illustrative X section</text>
<text x="500" y="1005" class="">Head:4.00±0.05 X ×14.00±0.05 Y; lower faceZ8.70</text>
<text x="500" y="1035" class="">Stem:Ø3.00±0.05; M2×0.4 ≥4.5 usable; Ø1.6 drill5.8 frombase</text>
<text x="500" y="1065" class="">Channel:7.40±0.05 Y; seat0.05 below measured copper underside</text>
<text x="500" y="1095" class="">Cap:minimum1.60 thick; underside bar-top clearance0.30 nominal</text>
<text x="500" y="1125" class="">Required allocated cap gap≥0.15 after full tolerance/measurement stack</text>
<text x="500" y="1155" class="">Cap holesØ1.8 atY±5.35; post M1.6×0.35 ≥4 usable,drill5.2</text>
<text x="500" y="1185" class="">Retainer height and slope must match measured assembled terminal planes</text>
<text x="38" y="1460" class="small">BAR: machine from certified6.35mm C11000/O60 plate; minimum normal Cu area20mm² at all necks/ramps. R3 full-depth turns;edge break≤0.10,no hole countersinks.</text>
<text x="38" y="1489" class="small">FINISH: APT bright tin,ASTM B545ClassB ≥5.08µm,process maximum10µm/face; compatibility/whisker/life approval open. Deburr before plating.</text>
<text x="38" y="1518" class="small">JOINT: Accu SPP-M3-8-A2 +HPW-M3-A2 washer0.55(+0/−0.10); head maxØ6/H2.52. Trial0.4Nm±10%,below0.5Nm terminal limit.</text>
<text x="38" y="1547" class="small">M2BASE: Accu SPK-M2-10-A2,metal Ø2.4/Ø4.8 90°undersideCSK through6.2plate; floor holeØ3.5 ONLY; PEEK carries no chassis current.</text>
<text x="38" y="1576" class="small">CAP: PTS A91201605 M1.6×5,A2. Trial cap0.02Nm/base0.05Nm are project trials,not approved PEEK torques. Verify creep/pullout.</text>
<text x="38" y="1605" class="small">ASSEMBLY: use temporary torque-holding fixture. Never transmit arbitrary wrench torque into the3mm PEEK stem or SMT stud solder.</text>
<text x="38" y="1634" class="small">MEASURE: each complete terminal joint≤0.35mΩ,bar≤0.1mΩ,PCB access≤1mΩ allocations; complete return≤2mΩ. No DC-to-RF/noise inference.</text>
